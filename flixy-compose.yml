services:
  flixy:
    build: .
    container_name: flixy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      APP_ENV: production
    networks:
      - default
      - 1panel-network
      - tdrive_default

networks:
  1panel-network:
    external: true
  tdrive_default:
    external: true
