services:
  flixy:
    build: .
    image: flixy:local
    container_name: flixy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:8082:80"
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      APP_ENV: production
    volumes:
      - ./storage/app:/app/storage/app
      - ./storage/logs:/app/storage/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default
      - 1panel-network
      - tdrive_default

  # Laravel's scheduler: nothing else calls `relay:prune-bot-updates`, so
  # without this container the bot_updates dedup table grows forever on an
  # install that never starts a supervisor (QUEUE_CONNECTION=sync).
  scheduler:
    image: flixy:local
    container_name: flixy-scheduler
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command:
      - php
      - /app/artisan
      - schedule:work
    volumes:
      - ./storage/app:/app/storage/app
      - ./storage/logs:/app/storage/logs
    depends_on:
      - flixy
    networks:
      - default
      - 1panel-network
      - tdrive_default

  worker:
    image: flixy:local
    container_name: flixy-worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command:
      - php
      - /app/artisan
      - relay:queue-supervisor
      - --queue=default
      - --poll=3
    volumes:
      - ./storage/app:/app/storage/app
      - ./storage/logs:/app/storage/logs
    depends_on:
      - flixy
    networks:
      - default
      - 1panel-network
      - tdrive_default


networks:
  1panel-network:
    external: true
  tdrive_default:
    external: true
