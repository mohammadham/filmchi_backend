# Internal pass-through for the media relay.
#
# The app answers with `X-Accel-Redirect: /relay-upstream/<urlencoded URL>`
# and nginx fetches the bytes itself, keeping PHP out of the streaming
# path entirely. The location is `internal`: it cannot be reached from
# the outside, and the application only ever redirects to whitelisted
# upstream hosts.
#
# nginx unescapes the redirect URI exactly once, which is why the app
# sends the URL urlencoded in the path. merge_slashes must stay off or
# the "http://" prefix would be normalized to "http:/" before the
# regex below ever sees it.
#
# Range requests are proxied natively by nginx (206/Content-Range come
# straight from the upstream), so seeking works without any PHP work.

merge_slashes off;

location ~ ^/relay-upstream/(.*)$ {
    internal;

    # Docker's embedded DNS resolves tdrive-app-1 / 9drive-backend-1.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $relay_target $1;

    proxy_pass $relay_target;

    # The internal (PHP) response defines the client-facing validators and
    # cache policy; upstream values must not override them, otherwise
    # If-None-Match revalidation in PHP would never match. The ETag and
    # tier arrive as redirect arguments (rte/rtt) because headers set on
    # the internal response do not reliably survive X-Accel-Redirect.
    proxy_hide_header ETag;
    proxy_hide_header Cache-Control;

    add_header ETag "$arg_rte" always;
    add_header X-Relay-Tier "$arg_rtt" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
