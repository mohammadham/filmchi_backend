# Internal pass-through for the media relay.
#
# The app answers with `X-Accel-Redirect: /relay-upstream?u=<encoded URL>`
# and nginx fetches the bytes itself, keeping PHP out of the streaming
# path entirely. The location is `internal`: it cannot be reached from
# the outside, only through the application's redirect, and the app only
# ever redirects to its own configured upstreams.
#
# Range requests are proxied natively by nginx (206/Content-Range come
# straight from the upstream), so seeking works without any PHP work.

location /relay-upstream {
    internal;

    # Docker's embedded DNS resolves tdrive-app-1 / 9drive-backend-1.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $relay_target $arg_u;

    proxy_pass $relay_target;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
